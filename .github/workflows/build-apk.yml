name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Позволяет запускать сборку вручную из вкладки Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Добавлено: кэширование npm для ускорения последующих сборок

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        # ИСПРАВЛЕНИЕ: версия обновлена с v3 на v4. 
        # v3 пытался скачать удаленный Google пакет "tools", v4 использует актуальные "cmdline-tools"
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        # Добавлено: автоматическое принятие лицензий Android SDK, чтобы избежать неожиданных ошибок сборки
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform
        # Создает папку android, если её еще нет (игнорирует ошибку, если она уже существует)
        run: npx cap add android || echo "Android platform already exists"

      - name: Sync web assets
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-world-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30 # Добавлено: файл будет храниться 30 дней (по умолчанию 90)
          if-no-files-found: error
