name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Позволяет запустить сборку вручную кнопкой в GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Установка зависимостей Node.js
        run: npm install

      - name: Setup Java (требуется для Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Сборка Android APK
        run: npm run build:apk

      - name: Загрузка APK в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: my-world-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
